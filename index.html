<meta charset="UTF-8">

<title>Carrito · Lista de Compras</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Cinzel:wght@400;500&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500&family=Bodoni+Moda:wght@400;500&family=Josefin+Sans:wght@300;400;600&family=EB+Garamond:wght@400;500&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}

/* ── THEMES ── */
body{transition:background 0.4s,color 0.4s;}

/* 1. VINO */
[data-theme="vino"]{
  --bg:#1a0a0f;--bg2:#240e15;--bg3:#2e1220;--surface:#3a1828;--surface2:#4a2035;

  --progress-ok:#c4395f;--progress-warn:#c9915a;--progress-bad:#e05555;
  --pill-ok-bg:rgba(196,57,95,0.2);--pill-ok-text:#f08fa8;
  --pill-warn-bg:rgba(201,145,90,0.2);--pill-warn-text:#e8b87a;
  --pill-bad-bg:rgba(224,85,85,0.2);--pill-bad-text:#f08080;
  --shadow:0 4px 24px rgba(139,26,58,0.3);
  --font-display:'Cormorant Garamond',serif;--font-body:'Montserrat',sans-serif;
  --radius:8px;--radius-lg:14px;
}

/* 9. ÁMBAR */

  --progress-ok:#c87020;--progress-warn:#a09020;--progress-bad:#c84040;

  --text:#ece0fc;--text2:#9878c0;--text3:#505080;

  --progress-ok:#a878e8;--progress-warn:#d0a040;--progress-bad:#e05858;

/* ── BASE STYLES ── */
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);min-height:100vh;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.02) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.015) 0%, transparent 50%);
}
.app{max-width:480px;margin:0 auto;padding:0 0 120px;}

/* ── THEME PICKER ── */
.theme-bar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100;
}
.theme-bar::-webkit-scrollbar{display:none;}
.theme-dot{
  width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:transform 0.2s,border-color 0.2s;
  position:relative;
}
.theme-dot:hover{transform:scale(1.2);}
.theme-dot.active{border-color:var(--text);transform:scale(1.15);}
.theme-dot[data-t="vino"]{background:radial-gradient(circle at 35% 35%,#c4395f,#8b1a3a,#1a0a0f);}
.theme-dot[data-t="oro"]{background:radial-gradient(circle at 35% 35%,#e8c84a,#c9a227,#0d0900);}
.theme-dot[data-t="plata"]{background:radial-gradient(circle at 35% 35%,#b8d4e8,#8ab4c8,#0a0c0f);}
.theme-dot[data-t="negro"]{background:radial-gradient(circle at 35% 35%,#333,#111,#000);}
.theme-dot[data-t="esmeralda"]{background:radial-gradient(circle at 35% 35%,#4db87a,#2d8c5a,#020f08);}
.theme-dot[data-t="zafiro"]{background:radial-gradient(circle at 35% 35%,#4a82e8,#2a5fc8,#020814);}
.theme-dot[data-t="marfil"]{background:radial-gradient(circle at 35% 35%,#e8d8b8,#c4a870,#faf7f0);}
.theme-dot[data-t="rose"]{background:radial-gradient(circle at 35% 35%,#e07898,#c05880,#0f0508);}
.theme-dot[data-t="ambar"]{background:radial-gradient(circle at 35% 35%,#e89040,#c87020,#0c0800);}
.theme-dot[data-t="pizarra"]{background:radial-gradient(circle at 35% 35%,#8aa8e0,#6888c8,#1c1f22);}
.theme-dot[data-t="obsidiana"]{background:radial-gradient(circle at 35% 35%,#a878e8,#8858c8,#06030a);}
.theme-dot[data-t="cobre"]{background:radial-gradient(circle at 35% 35%,#d87040,#b85020,#0a0500);}
.theme-label{font-size:11px;color:var(--text3);white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase;margin-right:4px;flex-shrink:0;}

/* ── HEADER ── */
.header{padding:28px 20px 18px;text-align:center;}
.header-title{
  font-family:var(--font-display);font-size:30px;font-weight:400;
  color:var(--text);letter-spacing:0.04em;
}
.header-title span{color:var(--gold);}
.header-sub{font-size:12px;color:var(--text3);margin-top:4px;letter-spacing:0.08em;text-transform:uppercase;}

/* ── BUDGET ── */
.budget-card{
  margin:0 16px 14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow);
}
.budget-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.budget-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;}
.budget-input-wrap{display:flex;align-items:center;gap:4px;}
.budget-sym{font-size:14px;color:var(--accent2);font-family:var(--font-display);}
.budget-input{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:18px;font-family:var(--font-display);
  width:110px;padding:6px 10px;text-align:right;
  transition:border-color 0.2s;
}
.budget-input:focus{outline:none;border-color:var(--border2);}
.prog-track{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:8px;}
.prog-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1),background 0.3s;}
.budget-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);}
.budget-nums b{color:var(--text2);font-weight:500;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 14px;}
.stat{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 16px;
}
.stat-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.stat-val{font-family:var(--font-display);font-size:26px;font-weight:400;color:var(--text);}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}

/* ── ADD FORM ── */
.add-card{
  margin:0 16px 14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;box-shadow:var(--shadow);
}
.add-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px;}
.row:last-child{margin-bottom:0;}
input,select{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:var(--radius);
  padding:10px 12px;font-size:14px;font-family:var(--font-body);
  transition:border-color 0.2s,background 0.2s;
}
input:focus,select:focus{outline:none;border-color:var(--border2);background:var(--surface2);}
input::placeholder{color:var(--text3);}
.inp-name{flex:1;}
.inp-cat{font-size:13px;}
.inp-qty{width:60px;text-align:center;}
.inp-price{width:110px;text-align:right;}
.btn-add{
  background:var(--btn-bg);color:var(--btn-text);border:none;
  border-radius:var(--radius);padding:10px 18px;
  font-size:13px;font-family:var(--font-body);font-weight:500;
  letter-spacing:0.06em;text-transform:uppercase;
  cursor:pointer;transition:background 0.2s,transform 0.1s;white-space:nowrap;
}
.btn-add:hover{background:var(--btn-hover);}
.btn-add:active{transform:scale(0.97);}

/* ── FILTERS & ACTIONS ── */
.controls{margin:0 16px 10px;display:flex;flex-direction:column;gap:8px;}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.fpill{
  font-size:12px;padding:5px 14px;border-radius:99px;flex-shrink:0;
  border:1px solid var(--border);background:transparent;
  color:var(--text3);cursor:pointer;letter-spacing:0.04em;
  transition:all 0.18s;font-family:var(--font-body);
}
.fpill.active{background:var(--accent);border-color:var(--accent);color:var(--btn-text);}
.action-row{display:flex;gap:6px;flex-wrap:wrap;}
.btn-sm{
  font-size:11px;padding:6px 12px;border-radius:var(--radius);
  border:1px solid var(--border);background:transparent;
  color:var(--text3);cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;
  font-family:var(--font-body);transition:all 0.18s;
}
.btn-sm:hover{border-color:var(--border2);color:var(--text2);}
.sort-sel{
  font-size:12px;padding:6px 10px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);margin-left:auto;font-family:var(--font-body);
}

/* ── LIST ── */
.list-wrap{margin:0 16px;}
.cat-head{
  font-size:11px;color:var(--text3);letter-spacing:0.12em;
  text-transform:uppercase;padding:12px 2px 6px;
  border-bottom:1px solid var(--border);margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
}
.cat-count{
  font-size:10px;background:var(--surface);color:var(--text3);
  padding:2px 7px;border-radius:99px;border:1px solid var(--border);
}
.item{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:6px;
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  transition:opacity 0.25s,border-color 0.2s;
}
.item:hover{border-color:var(--border2);}
.item.done{opacity:0.38;}
.item.done .iname{text-decoration:line-through;color:var(--text3);}
.check{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all 0.18s;background:transparent;
}
.check:hover{border-color:var(--accent2);}
.check.on{background:var(--accent);border-color:var(--accent);}
.check-svg{display:none;width:12px;height:12px;stroke:var(--btn-text);stroke-width:2.5;fill:none;}
.check.on .check-svg{display:block;}
.iinfo{flex:1;min-width:0;}
.iname{font-size:14px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.imeta{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:0.02em;}
.iprice-area{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.price-field{
  width:86px;font-size:14px;text-align:right;
  border:1px solid var(--border);border-radius:var(--radius);
  padding:6px 8px;background:var(--surface);color:var(--text);
  font-family:var(--font-display);transition:border-color 0.2s,background 0.2s;
}
.price-field:focus{outline:none;border-color:var(--border2);background:var(--surface2);}
.price-field.has{border-color:var(--border2);color:var(--gold);}
.isub{font-family:var(--font-display);font-size:14px;color:var(--text2);min-width:58px;text-align:right;}
.isub.zero{color:var(--text3);}
.del-btn{
  background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:18px;padding:2px;border-radius:4px;line-height:1;
  transition:color 0.15s;
}
.del-btn:hover{color:var(--pill-bad-text);}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-ico{font-size:42px;display:block;margin-bottom:12px;opacity:0.4;}
.empty-txt{font-family:var(--font-display);font-size:18px;font-weight:300;}

/* ── CAJA TOTAL ── */
.caja{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:14px 20px 20px;z-index:200;
  backdrop-filter:blur(12px);
}
.caja-inner{display:flex;align-items:center;justify-content:space-between;}
.caja-left .caja-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;}
.caja-left .caja-total{font-family:var(--font-display);font-size:32px;font-weight:400;color:var(--text);}
.caja-right-info{text-align:right;}
.caja-pill{
  display:inline-block;font-size:13px;padding:5px 14px;border-radius:99px;
  font-family:var(--font-display);margin-bottom:3px;
}
.pill-ok{background:var(--pill-ok-bg);color:var(--pill-ok-text);}
.pill-warn{background:var(--pill-warn-bg);color:var(--pill-warn-text);}
.pill-bad{background:var(--pill-bad-bg);color:var(--pill-bad-text);}
.caja-hint{font-size:11px;color:var(--text3);}

/* ── ANIMS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.item{animation:fadeIn 0.2s ease;}
</style>
</head>
<body data-theme="vino">

<div class="theme-bar">
  <span class="theme-label">Tema</span>
  <div class="theme-dot active" data-t="vino" title="Vino"></div>
  <div class="theme-dot" data-t="oro" title="Oro"></div>
  <div class="theme-dot" data-t="plata" title="Plata"></div>
  <div class="theme-dot" data-t="negro" title="Negro"></div>
  <div class="theme-dot" data-t="esmeralda" title="Esmeralda"></div>
  <div class="theme-dot" data-t="zafiro" title="Zafiro"></div>
  <div class="theme-dot" data-t="marfil" title="Marfil"></div>
  <div class="theme-dot" data-t="rose" title="Rosé"></div>
  <div class="theme-dot" data-t="ambar" title="Ámbar"></div>
  <div class="theme-dot" data-t="pizarra" title="Pizarra"></div>
  <div class="theme-dot" data-t="obsidiana" title="Obsidiana"></div>
  <div class="theme-dot" data-t="cobre" title="Cobre"></div>
</div>

<div class="app">
  <header class="header">
    <div class="header-title"><span>✦</span> Carrito</div>
    <div class="header-sub">Lista de compras · Total en tiempo real</div>
  </header>

  <div class="budget-card">
    <div class="budget-top">
      <span class="budget-lbl">Presupuesto del mes</span>
      <div class="budget-input-wrap">
        <span class="budget-sym">$</span>
        <input class="budget-input" id="budgetIn" type="number" placeholder="0" min="0" step="any">
      </div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%;background:var(--progress-ok)"></div></div>
    <div class="budget-nums">
      <span>Gastado: <b id="spentLbl">$0</b></span>
      <span id="remLbl"></span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">Total acumulado</div>
      <div class="stat-val" id="totalVal">$0</div>
      <div class="stat-sub" id="pricedSub">0 ítems con precio</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Progreso</div>
      <div class="stat-val" id="progVal">0/0</div>
      <div class="stat-sub" id="pendSub">0 pendientes</div>
    </div>
  </div>

  <div class="add-card">
    <div class="add-title">Agregar producto</div>
    <div class="row">
      <input class="inp-name" id="newName" type="text" placeholder="Nombre del producto...">
      <select class="inp-cat" id="newCat">
        <option value="Verdulería">🥦 Verdulería</option>
        <option value="Carnicería">🥩 Carnicería</option>
        <option value="Lácteos">🥛 Lácteos</option>
        <option value="Almacén" selected>🛒 Almacén</option>
        <option value="Limpieza">🧼 Limpieza</option>
        <option value="Higiene">🪥 Higiene</option>
        <option value="Bebidas">🧃 Bebidas</option>
        <option value="Panadería">🍞 Panadería</option>
        <option value="Congelados">❄️ Congelados</option>
        <option value="Otro">📦 Otro</option>
      </select>
    </div>
    <div class="row">
      <input class="inp-qty" id="newQty" type="number" placeholder="Ctd." min="1" value="1">
      <input class="inp-price" id="newPrice" type="number" placeholder="Precio $" step="any" min="0" style="flex:1;">
      <button class="btn-add" onclick="addItem()">+ Agregar</button>
    </div>
  </div>

  <div class="controls">
    <div class="filter-row" id="filterRow">
      <button class="fpill active" onclick="setFilter('all',this)">Todos</button>
    </div>
    <div class="action-row">
      <button class="btn-sm" onclick="clearDone()">Quitar tachados</button>
      <button class="btn-sm" onclick="clearAll()">Limpiar lista</button>
      <select class="sort-sel" id="sortSel" onchange="renderList()">
        <option value="cat">Por categoría</option>
        <option value="alpha">Alfabético</option>
        <option value="price">Mayor precio</option>
        <option value="added">Por ingreso</option>
      </select>
    </div>
  </div>

  <div class="list-wrap" id="listWrap"></div>
</div>

<div class="caja" id="caja" style="display:none;">
  <div class="caja-inner">
    <div class="caja-left">
      <div class="caja-lbl">Total a pagar</div>
      <div class="caja-total" id="cajaTotal">$0</div>
    </div>
    <div class="caja-right-info">
      <div class="caja-pill pill-ok" id="cajaPill"></div>
      <div class="caja-hint" id="cajaHint"></div>
    </div>
  </div>
</div>

<script>
const CATS=['Verdulería','Carnicería','Lácteos','Almacén','Limpieza','Higiene','Bebidas','Panadería','Congelados','Otro'];
let items=JSON.parse(localStorage.getItem('cv2_items')||'[]');
let budget=parseFloat(localStorage.getItem('cv2_budget')||'0')||0;
let activeTheme=localStorage.getItem('cv2_theme')||'vino';
let activeFilter='all';

// Theme
document.body.setAttribute('data-theme',activeTheme);
document.querySelectorAll('.theme-dot').forEach(d=>{
  d.classList.toggle('active',d.dataset.t===activeTheme);
  d.addEventListener('click',()=>{
    activeTheme=d.dataset.t;
    document.body.setAttribute('data-theme',activeTheme);
    localStorage.setItem('cv2_theme',activeTheme);
    document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));
    d.classList.add('active');
  });
});

// Budget
if(budget>0) document.getElementById('budgetIn').value=budget;
document.getElementById('budgetIn').addEventListener('input',function(){
  budget=parseFloat(this.value)||0;
  localStorage.setItem('cv2_budget',budget);
  updateTotals();
});

// Inputs
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});
document.getElementById('newPrice').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});

function fmt(n){
  if(n>=1000) return '$'+Math.round(n).toLocaleString('es-AR');
  return '$'+Math.round(n);
}

function save(){localStorage.setItem('cv2_items',JSON.stringify(items));}

function addItem(){
  const name=document.getElementById('newName').value.trim();
  if(!name){document.getElementById('newName').focus();return;}
  const cat=document.getElementById('newCat').value;
  const qty=Math.max(1,parseInt(document.getElementById('newQty').value)||1);
  const price=parseFloat(document.getElementById('newPrice').value)||0;
  items.push({id:Date.now(),name,cat,qty,price,done:false});
  save();
  document.getElementById('newName').value='';
  document.getElementById('newPrice').value='';
  document.getElementById('newQty').value='1';
  document.getElementById('newName').focus();
  renderAll();
}

function toggle(id){
  const it=items.find(i=>i.id===id);
  if(it){it.done=!it.done;save();renderAll();}
}
function setPrice(id,val){
  const it=items.find(i=>i.id===id);
  if(!it)return;
  it.price=parseFloat(val)||0;save();
  const sf=document.getElementById('pf_'+id);
  if(sf){sf.className='price-field'+(it.price>0?' has':'');}
  const ss=document.getElementById('sub_'+id);
  if(ss){
    const sub=it.price*it.qty;
    ss.textContent=sub>0?fmt(sub):'—';
    ss.className='isub'+(sub===0?' zero':'');
  }
  updateTotals();
}
function delItem(id){items=items.filter(i=>i.id!==id);save();renderAll();}
function clearDone(){items=items.filter(i=>!i.done);save();renderAll();}
function clearAll(){if(!items.length)return;if(!confirm('¿Limpiar toda la lista?'))return;items=[];save();renderAll();}
function setFilter(val,el){
  activeFilter=val;
  document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function updateTotals(){
  const priced=items.filter(i=>i.price>0);
  const total=priced.reduce((a,i)=>a+i.price*i.qty,0);
  const done=items.filter(i=>i.done).length;
  document.getElementById('totalVal').textContent=fmt(total);
  document.getElementById('pricedSub').textContent=priced.length+' ítem'+(priced.length!==1?'s':'')+' con precio';
  document.getElementById('progVal').textContent=done+'/'+items.length;
  document.getElementById('pendSub').textContent=(items.length-done)+' pendiente'+(items.length-done!==1?'s':'');
  document.getElementById('spentLbl').textContent=fmt(total);

  const fill=document.getElementById('progFill');
  const remEl=document.getElementById('remLbl');
  if(budget>0){
    const pct=Math.min(100,(total/budget)*100);
    fill.style.width=pct+'%';
    const col=pct>=100?'var(--progress-bad)':pct>=80?'var(--progress-warn)':'var(--progress-ok)';
    fill.style.background=col;
    const rem=budget-total;
    if(rem>=0) remEl.innerHTML='Restante: <b>'+fmt(rem)+'</b>';
    else remEl.innerHTML='Excedido: <b style="color:var(--pill-bad-text)">'+fmt(-rem)+'</b>';
  } else {
    fill.style.width='0%';remEl.textContent='';
  }

  const caja=document.getElementById('caja');
  if(items.length>0){
    caja.style.display='block';
    document.getElementById('cajaTotal').textContent=fmt(total);
    const pill=document.getElementById('cajaPill');
    const hint=document.getElementById('cajaHint');
    if(budget>0){
      const rem=budget-total;
      if(rem>=0){
        pill.className='caja-pill pill-ok';pill.textContent=fmt(rem)+' disponible';
        hint.textContent='dentro del presupuesto';
      } else if(-rem/budget<0.1){
        pill.className='caja-pill pill-warn';pill.textContent=fmt(-rem)+' de más';
        hint.textContent='casi en el límite';
      } else {
        pill.className='caja-pill pill-bad';pill.textContent=fmt(-rem)+' excedido';
        hint.textContent='presupuesto superado';
      }
    } else {
      const sp=items.filter(i=>i.price===0).length;
      pill.className='caja-pill pill-ok';
      if(sp>0){pill.textContent=sp+' sin precio';hint.textContent='precio pendiente';}
      else{pill.textContent='Todo cargado';hint.textContent='lista completa';}
    }
  } else {
    caja.style.display='none';
  }
}

function getFiltered(){
  let arr=[...items];
  if(activeFilter!=='all') arr=arr.filter(i=>i.cat===activeFilter);
  const sort=document.getElementById('sortSel').value;
  if(sort==='alpha') arr.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  else if(sort==='price') arr.sort((a,b)=>(b.price*b.qty)-(a.price*a.qty));
  return arr;
}

function itemHTML(it){
  const sub=it.price>0?fmt(it.price*it.qty):'—';
  return `<div class="item${it.done?' done':''}" id="itm_${it.id}">
  <div class="check${it.done?' on':''}" data-id="${it.id}" tabindex="0" role="checkbox" aria-checked="${it.done}" aria-label="${it.name}">
    <svg class="check-svg" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>
  </div>
  <div class="iinfo">
    <div class="iname">${it.name}</div>
    <div class="imeta">${it.qty>1?'×'+it.qty+' · ':''}${it.cat}</div>
  </div>
  <div class="iprice-area">
    <input class="price-field${it.price>0?' has':''}" id="pf_${it.id}" data-id="${it.id}" type="number" value="${it.price||''}" placeholder="$" step="any" min="0" aria-label="Precio">
    <span class="isub${it.price===0?' zero':''}" id="sub_${it.id}">${sub}</span>
  </div>
  <button class="del-btn" data-id="${it.id}" aria-label="Eliminar">✕</button>
</div>`;
}

function renderFilters(){
  const cats=[...new Set(items.map(i=>i.cat))];
  const bar=document.getElementById('filterRow');
  bar.innerHTML=`<button class="fpill${activeFilter==='all'?' active':''}" onclick="setFilter('all',this)">Todos</button>`;
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='fpill'+(activeFilter===c?' active':'');
    b.textContent=c;
    b.onclick=function(){setFilter(c,this);};
    bar.appendChild(b);
  });
}

function renderList(){
  const wrap=document.getElementById('listWrap');
  const arr=getFiltered();
  const sort=document.getElementById('sortSel').value;
  if(!arr.length){
    wrap.innerHTML='<div class="empty"><span class="empty-ico">✦</span><div class="empty-txt">La lista está vacía</div><div style="font-size:13px;color:var(--text3);margin-top:6px;">Agregá productos arriba</div></div>';
    updateTotals();return;
  }
  if(sort==='cat'&&activeFilter==='all'){
    const bycat={};
    CATS.forEach(c=>bycat[c]=[]);
    arr.forEach(i=>{if(!bycat[i.cat])bycat[i.cat]=[];bycat[i.cat].push(i);});
    let html='';
    CATS.forEach(cat=>{
      if(!bycat[cat]||!bycat[cat].length)return;
      html+=`<div class="cat-head">${cat}<span class="cat-count">${bycat[cat].length}</span></div>`;
      html+=bycat[cat].map(itemHTML).join('');
    });
    wrap.innerHTML=html;
  } else {
    wrap.innerHTML=arr.map(itemHTML).join('');
  }
  // events
  wrap.querySelectorAll('.check').forEach(el=>{
    el.onclick=()=>toggle(parseInt(el.dataset.id));
    el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(parseInt(el.dataset.id));}};
  });
  wrap.querySelectorAll('.price-field').forEach(el=>{
    el.oninput=()=>setPrice(parseInt(el.dataset.id),el.value);
    el.onfocus=function(){this.select();};
  });
  wrap.querySelectorAll('.del-btn').forEach(el=>{
    el.onclick=()=>delItem(parseInt(el.dataset.id));
  });
  updateTotals();
}

function renderAll(){renderFilters();renderList();}
renderAll();
</script>
</body>
</html>
